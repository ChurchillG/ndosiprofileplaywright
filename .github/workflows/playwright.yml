name: Ndosi Profile Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 00:00 SAST = 22:00 UTC the previous day (SAST is UTC+2, no DST)
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Generate credentials CSV from secrets
        run: |
          echo "username,password" > test-data/login-credentials.csv
          echo "${{ secrets.NDOSI_USERNAME }},${{ secrets.NDOSI_PASSWORD }}" >> test-data/login-credentials.csv

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: Load previous Allure history
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into current results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/ 2>/dev/null || true

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Publish Allure report to GitHub Pages
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history